name: test
# Branch-filtered on purpose. A bare `on: push` fires for every branch a machine happens to
# push — including the `auto-backup/<host>` snapshots backup.mjs creates — which turns one
# failing run into a daily failure email. See CHANGELOG v0.4.3.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      # The suite scaffolds fixture git repos and commits in them. It sets its own
      # GIT_AUTHOR_*/GIT_COMMITTER_* env vars, so no runner git identity is needed.
      - run: npm test
